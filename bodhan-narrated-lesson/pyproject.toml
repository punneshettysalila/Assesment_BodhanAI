[project]
name = "bodhan-lesson"
version = "0.1.0"
description = "Scanned textbook chapter -> translated, narrated lesson using Bodhan Indic models"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "openai>=1.50",
  "pydantic>=2.7",
  "tenacity>=8.2",
  "PyYAML>=6.0",
  "pdf2image>=1.17",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "jiwer>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
